<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CRM BRASSUR — Gestión de proveedores de materiales metálicos reciclables" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BRASSUR CRM" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>CRM BRASSUR — Proveedores</title>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #0f172a;
        color: #b8cfc6;
        font-family: 'Segoe UI', system-ui, sans-serif;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #app-splash.app-splash--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-splash img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
      }
      #app-splash strong {
        color: #fff;
        font-size: 1.35rem;
        letter-spacing: -0.02em;
      }
      #app-splash span {
        font-size: 0.85rem;
        color: #c9a227;
      }
      .app-splash__spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(184, 207, 198, 0.25);
        border-top-color: #1e5f4a;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <img src="/icons/icon-192.png" alt="" width="96" height="96" />
      <strong>CRM BRASSUR</strong>
      <span>Proveedores metálicos</span>
      <div class="app-splash__spinner" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
