<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CRM BRASSUR — Gestión de proveedores de materiales metálicos reciclables" />
    <meta name="theme-color" content="#052E16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BRASSUR" />
    <link rel="icon" type="image/png" href="/logo/logo.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>CRM BRASSUR — Proveedores</title>
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #ffffff;
        color: #2a2a2a;
        font-family: 'Segoe UI', system-ui, sans-serif;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }
      #app-splash.app-splash--hide {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #app-splash img {
        width: 180px;
        max-width: 72vw;
        height: auto;
        object-fit: contain;
      }
      #app-splash strong {
        color: #052e16;
        font-size: 1.35rem;
        letter-spacing: 0.04em;
      }
      #app-splash span {
        font-size: 0.75rem;
        font-weight: 600;
        color: #00853f;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .app-splash__spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(0, 133, 63, 0.2);
        border-top-color: #00853f;
        border-radius: 50%;
        animation: splash-spin 0.8s linear infinite;
      }
      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <img src="/logo/logo.png" alt="Brassur" width="180" height="auto" />
      <strong>CRM BRASSUR</strong>
      <span>Proveedores metálicos</span>
      <div class="app-splash__spinner" aria-hidden="true"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
